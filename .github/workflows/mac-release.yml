name: macOS Release

# Mac Catalyst release. A SEPARATE workflow on a SEPARATE tag prefix, so a
# failure here cannot touch the iOS pipeline — which is proven and has shipped
# builds. `v*` does not match `mac-v*`, so the two never both fire.
#
# UNVERIFIED: this has never completed a run. The first `mac-v*` tag is the test.
# See the `beta_mac` lane in fastlane/Fastfile for the three things most likely
# to need adjusting (pod mode, the maccatalyst. bundle-id prefix, and Catalyst
# signing material, which is a different certificate from the iOS one).
#
# Trigger: `scripts/release.sh mac 1.0.1` (or: git tag mac-v1.0.1 && git push origin mac-v1.0.1)
on:
  push:
    tags:
      - 'mac-v*'

# One release build per tag; a re-push of the same tag supersedes an in-flight run.
concurrency:
  group: mac-release-${{ github.ref }}
  cancel-in-progress: true

# Only checkout needs the repo. flatfold-certs is cloned by match over HTTPS with
# MATCH_GIT_BASIC_AUTHORIZATION, NOT the GITHUB_TOKEN — so no extra token scope here.
permissions:
  contents: read

jobs:
  testflight-mac:
    runs-on: macos-15
    env:
      # fastlane emits warnings and can misbehave under a non-UTF-8 locale.
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8
      FASTLANE_SKIP_UPDATE_CHECK: 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          # Same Node as ci.yml (satisfies engines.node >=20; dev baseline is 24).
          node-version: '24'
          cache: npm

      # npm ci (not install) so the lockfile is authoritative. postinstall runs
      # `wrangler types` to generate worker-configuration.d.ts (gitignored) — local
      # codegen from wrangler.jsonc, needs no Cloudflare credentials.
      - name: Install JS deps
        run: npm ci
        env:
          WRANGLER_SEND_METRICS: false

      - name: Generated worker types present
        run: test -f worker-configuration.d.ts

      # NOT `npm run build:native`. That runs `cap sync`, which reinstalls pods in
      # iOS mode and leaves the Catalyst build to fail with a misleading
      # "Unable to resolve module dependency: 'IONFilesystemLib'" —
      # @capacitor/filesystem ships no maccatalyst slice. Do the same work with
      # `cap copy` (assets only), then install pods in Catalyst mode explicitly.
      - name: Build web + copy assets
        run: |
          npx vite build
          node scripts/gen-sw-manifest.mjs
          node scripts/inject-native-csp.mjs
          npx cap copy ios
        env:
          WRANGLER_SEND_METRICS: false

      - name: Install pods in CATALYST mode
        run: |
          cd ios/App
          FLATFOLD_CATALYST=1 bundle exec pod install || FLATFOLD_CATALYST=1 pod install
          echo "pod mode: $(cat Pods/.flatfold-pod-mode)"
          test "$(cat Pods/.flatfold-pod-mode)" = "catalyst"

      - name: Select newest Xcode
        # Capacitor 8's generated AppDelegate.swift needs Xcode 16+ (the default
        # on macos-14 is 15.4, which fails to compile it). Select the newest
        # Xcode installed on the runner rather than pinning a patch version that
        # image updates could remove.
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version

      # Pinned to a full commit SHA (supply-chain: this workflow holds the Apple
      # signing secrets, so a moved third-party tag could exfiltrate them). SHA
      # is the v1 tag as of 2026-07-22; bump deliberately. checkout/setup-node
      # are first-party (GHA trust boundary) and don't need pinning.
      - uses: ruby/setup-ruby@a30dfa457ad68707b8b910ac3a244714b61c0626 # v1
        with:
          # Matches the local toolchain (ruby 3.4). bundler-cache installs the
          # pinned fastlane from the Gemfile and caches it between runs.
          ruby-version: '3.4'
          bundler-cache: true

      # Decode the App Store Connect API private key (.p8) from a secret to a file
      # OUTSIDE the repo tree (RUNNER_TEMP), so it can never be committed. ASC_KEY_PATH
      # (absolute) is read by asc_api_key in the Fastfile. Never echoed.
      - name: Write App Store Connect API key
        env:
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
        run: |
          echo "$ASC_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"

      - name: Build and upload to TestFlight
        run: bundle exec fastlane mac beta_mac
        env:
          # Passphrase that decrypts the certs/profiles in flatfold-certs.
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          # base64 of "x-access-token:<PAT>"; lets match clone flatfold-certs over
          # HTTPS (CI has no SSH key). Its presence also flips the Matchfile git_url
          # to https. match reads this env var automatically.
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          # App Store Connect API key identity (App Manager role). ASC_KEY_PATH points
          # at the .p8 decoded above; asc_api_key in the Fastfile reads all three.
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
