<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="FlatFold">
  <!-- FlatFold mark: a square sheet with its corner flat-folded to the centre.
       Theme-aware: uses the ponderance color custom properties, falls back to light-mode hexes. -->
