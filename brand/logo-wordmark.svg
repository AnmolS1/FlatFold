<svg viewBox="0 0 216 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="FlatFold">
  <!-- Wordmark: mark + name. Requires Bricolage Grotesque to be loaded on the page
       (self-hosted in-app); falls back to system sans. Theme-aware via the color custom properties. -->
  <g transform="translate(0 8) scale(0.75)">
    <path d="M8 8H32L56 32V56H8Z" fill="var(--color-inset, #FFFFFF)"/>
    <path d="M8 8L56 56" stroke="var(--color-crease-line, rgba(46,94,140,0.13))" stroke-width="1.5"/>
    <path d="M8 56L44 20" stroke="var(--color-crease-line-bold, rgba(46,94,140,0.28))" stroke-width="1.5"/>
    <path d="M32 8L56 32L32 32Z" fill="var(--color-crane, #E84A27)" stroke="var(--color-crane-dark, #C23A1C)" stroke-width="1" stroke-linejoin="round"/>
    <path d="M8 8H32L56 32V56H8Z" stroke="var(--color-crease, #2E5E8C)" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
  <text x="58" y="42" font-family="var(--font-display, 'Bricolage Grotesque'), ui-sans-serif, system-ui, sans-serif"
        font-size="29" font-weight="650" letter-spacing="-0.5"
        fill="var(--color-graphite, #1B2A33)">FlatFold</text>
</svg>
