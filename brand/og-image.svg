  </g>
  <text x="430" y="308" font-family="Bricolage Grotesque 96pt ExtraBold" font-size="108" fill="#1B2A33">FlatFold</text>
  <text x="434" y="372" font-family="Hanken Grotesk" font-size="33" fill="rgba(27,42,51,0.72)">End-to-end encrypted messaging.</text>
  <text x="434" y="418" font-family="Hanken Grotesk" font-size="33" fill="rgba(27,42,51,0.72)">Nothing stored. Nothing to hand over.</text>
