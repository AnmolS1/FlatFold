<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
	<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
	<link rel="mask-icon" href="/mask-icon.svg" color="#2E5E8C" />
	<link rel="manifest" href="/manifest.webmanifest" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
	<meta name="theme-color" content="#EEF0EC" media="(prefers-color-scheme: light)" />
	<meta name="theme-color" content="#0E1A24" media="(prefers-color-scheme: dark)" />
	<title>FlatFold</title>

	<!-- Link previews (iMessage, Slack, Twitter, …). Absolute URLs: most scrapers
	     won't resolve relative ones. These are static public files — the scrape
	     reveals nothing about users (rebuild invariant 5). -->
	<meta property="og:title" content="FlatFold" />
	<meta property="og:description" content="End-to-end encrypted messaging. Nothing stored. Nothing to hand over." />
	<meta property="og:url" content="https://flatfold.ponderance.dev" />
	<meta property="og:image" content="https://flatfold.ponderance.dev/og-image.png" />
	<meta property="og:image:width" content="1200" />
	<meta property="og:image:height" content="630" />
	<meta property="og:type" content="website" />
	<meta name="twitter:card" content="summary_large_image" />
	<meta name="twitter:image" content="https://flatfold.ponderance.dev/og-image.png" />
	<!-- Render-blocking, external (CSP: script-src 'self', no unsafe-inline):
	     sets .dark on <html> before first paint to avoid a theme flash. -->
	<script src="/theme-init.js"></script>
</head>

<body>
	<div id="root"></div>
	<script type="module" src="/src/main.tsx"></script>
</body>

</html>
